<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virtual Diya Wall</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- shared gradients for every diya -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd76a"/><stop offset=".55" stop-color="#e08a1e"/><stop offset="1" stop-color="#8a3d0c"/>
      </linearGradient>
      <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffe9a0"/><stop offset=".5" stop-color="#ffc247"/><stop offset="1" stop-color="#d9791a"/>
      </linearGradient>
      <radialGradient id="oil" cx=".5" cy=".4" r=".7">
        <stop offset="0" stop-color="#7a3a10"/><stop offset="1" stop-color="#3a1604"/>
      </radialGradient>
      <linearGradient id="flameOuter" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#ff5a1f"/><stop offset=".55" stop-color="#ffa51f"/><stop offset="1" stop-color="#ffe27a"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="moon" aria-hidden="true"></div>
  <svg id="skyline" viewBox="0 0 1440 240" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="lights" id="lights" aria-hidden="true"></div>

  <svg class="rangoli" viewBox="-200 -200 400 400" aria-hidden="true">
    <g fill="none" stroke="#ffc247" stroke-width="1.2">
      <g id="petalRing">
        <g transform="rotate(0)"><path d="M0 -60 C 28 -100 28 -150 0 -190 C -28 -150 -28 -100 0 -60Z"/></g>
        <g transform="rotate(30)"><path d="M0 -60 C 28 -100 28 -150 0 -190 C -28 -150 -28 -100 0 -60Z"/></g>
        <g transform="rotate(60)"><path d="M0 -60 C 28 -100 28 -150 0 -190 C -28 -150 -28 -100 0 -60Z"/></g>
        <g transform="rotate(90)"><path d="M0 -60 C 28 -100 28 -150 0 -190 C -28 -150 -28 -100 0 -60Z"/></g>
        <g transform="rotate(120)"><path d="M0 -60 C 28 -100 28 -150 0 -190 C -28 -150 -28 -100 0 -60Z"/></g>
        <g transform="rotate(150)"><path d="M0 -60 C 28 -100 28 -150 0 -190 C -28 -150 -28 -100 0 -60Z"/></g>
        <g transform="rotate(180)"><path d="M0 -60 C 28 -100 28 -150 0 -190 C -28 -150 -28 -100 0 -60Z"/></g>
        <g transform="rotate(210)"><path d="M0 -60 C 28 -100 28 -150 0 -190 C -28 -150 -28 -100 0 -60Z"/></g>
        <g transform="rotate(240)"><path d="M0 -60 C 28 -100 28 -150 0 -190 C -28 -150 -28 -100 0 -60Z"/></g>
        <g transform="rotate(270)"><path d="M0 -60 C 28 -100 28 -150 0 -190 C -28 -150 -28 -100 0 -60Z"/></g>
        <g transform="rotate(300)"><path d="M0 -60 C 28 -100 28 -150 0 -190 C -28 -150 -28 -100 0 -60Z"/></g>
        <g transform="rotate(330)"><path d="M0 -60 C 28 -100 28 -150 0 -190 C -28 -150 -28 -100 0 -60Z"/></g>
      </g>
      <circle r="60"/><circle r="40"/><circle r="196" stroke-dasharray="2 8"/>
    </g>
  </svg>

  <main>
    <header>
      <h1 id="title"></h1>
      <p class="tagline" id="tagline"></p>
      <p class="lead" id="lead"></p>
    </header>

    <section class="panel" aria-label="Light a diya">
      <form id="form" autocomplete="off">
        <label class="sr" for="name">Your name</label>
        <input id="name" type="text" maxlength="24" placeholder="Enter your name" required />
        <button type="submit" id="lightBtn"><span class="btn-diya">🪔</span> <span id="lightLbl">Add my diya</span></button>
      </form>

      <p class="count" id="count" aria-live="polite"></p>

      <div class="wall" id="wall"></div>

      <div class="actions" id="hostActions" hidden>
        <button type="button" id="igniteBtn">🚀 Light all diyas together</button>
        <button type="button" id="clearBtn" class="ghost">Clear all</button>
      </div>
    </section>

    <footer>
      <div class="crackers" aria-hidden="true"><span>🧨</span><span>🚀</span><span>🎇</span><span>🪔</span><span>🎆</span><span>🚀</span><span>🧨</span></div>
      <p class="blessing" id="blessing"></p>
      <p class="mode" id="mode"></p>
      <button type="button" id="hostLink" class="linkbtn">Host login</button>
    </footer>
  </main>

  <div class="countdown" id="countdown" aria-live="assertive"><span id="cdNum"></span><p>🚀 Lift-off in…</p></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
